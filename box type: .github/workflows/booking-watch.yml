name: booking-watch

on:
  # schedule:
  #   - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug secrets presence (non-sensitive)
        # This only prints whether the env var exists (True/False) — it does not
        # print secret values.
        run: |
          python - <<'PY'
          import os
          print("SCRAPERAPI_KEY present:", bool(os.environ.get("SCRAPERAPI_KEY")))
          print("PROXY_URL present:", bool(os.environ.get("PROXY_URL")))
          print("TELEGRAM_BOT_TOKEN present:", bool(os.environ.get("TELEGRAM_BOT_TOKEN")))
          print("TELEGRAM_CHAT_ID present:", bool(os.environ.get("TELEGRAM_CHAT_ID")))
          PY

      - name: Run poller
        # Use fallbacks for secret names so small variations in secret naming
        # won't break the workflow. GitHub expressions return an empty string for
        # non-existent secrets, so the `||` picks the first non-empty one.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY || secrets.SCRAPEAPI || secrets.scraperapi_key || secrets.SCRAPER_API }}
          PROXY_URL: ${{ secrets.PROXY_URL || secrets.proxy_url }}
        run: python poller.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "booking-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update booking-watch state [skip ci]"
            git push
          else
            echo "No state change."
          fi
